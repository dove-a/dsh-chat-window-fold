name: Release

# Tag-triggered publish pipeline (dsh-web-ui release.yml pattern, single
# package variant): pushing a vX.Y.Z tag is the single release switch.
# The workflow verifies package.json version equals the tag, runs the full
# gate, publishes to npm (requires the repository secret NPM_TOKEN — an npm
# automation/granular token with Bypass 2FA), then creates the GitHub
# Release with the packed tarball attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, publish, release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run the release gate (syntax + sandbox load test)
        run: npm run check

      - name: Verify package version matches the tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::package.json version $PKG does not match tag version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          npm publish --access public

      - name: Pack the tarball
        run: npm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" dsh-chat-window-fold-$VERSION.tgz \
            --title "dsh-chat-window-fold $GITHUB_REF_NAME" \
            --generate-notes